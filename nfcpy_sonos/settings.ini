# This file contains the settings for the nfcpy_sonos scripts.

[Sonos]
# The IP address and port of the node-sonos-http-api server.
Server: http://localhost:5005
# The name of the Sonos room to control.
Room: Kitchen

[MySonos]
# Set to True to run in test mode (no commands sent to Sonos).
test: False
# The number of seconds to wait after a card is read before listening for more cards.
debounce: 10
# The number of seconds to wait before re-reading the same card.
cardTimeout: 0
# Set to "yes" to enable write mode. "loop" to write multiple cards from a Google Sheet.
#write: no

# Set to "yes" to enable quiet time from 9 PM to 7 AM.
# During quiet time, the script will not play any music.
quietTime: yes

# Set to "on" to enable the lights.
lightsonoff: on

# The type of lights to use. Options are "jamhat", "blinkstick", and "GPIO".
lighttype: jamhat